# Proxy CONNECT pentru eMAG Marketplace. Nimic altceva.
#
# ═══ CE FACE, SI CE NU ═══
#
# eMAG accepta apeluri doar de la adrese IP declarate in prealabil, iar Vercel n-are
# IP de iesire fix. Serverul asta e punctul de iesire stabil: are IP fix, iar
# comerciantul il albeste o singura data in contul lui eMAG.
#
# ⚠ NUMAI `CONNECT`. Nu se termina TLS aici, nu se citeste nimic, nu se pastreaza
# nimic. Squid deschide un tunel si copiaza octeti — deci parola eMAG a
# comerciantului trece prin server CIFRATA si ramane necitibila. Un releu care ar
# termina TLS ar fi devenit al doilea loc din care se pot citi credentialele
# TUTUROR comerciantilor, pentru exact acelasi folos.
#
# ═══ ⚠ DE CE NU E RESTRANS PE IP DE INTRARE ═══
#
# Fiindca n-avem ce restrange: tocmai lipsa unui IP fix la Vercel e problema pe care
# serverul asta o rezolva. Deci singura aparare la intrare e PAROLA.
#
# Ceea ce face a doua aparare obligatorie, si ea e lista de gazde: chiar daca parola
# proxy-ului s-ar scurge, el nu poate fi folosit ca releu deschis catre internet —
# raspunde numai pentru cele trei gazde eMAG, numai pe 443.

# ── Autentificare ────────────────────────────────────────────────────────────
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/parole
auth_param basic realm edinio
auth_param basic children 5
# O ora: la fiecare cerere s-ar citi fisierul de parole degeaba.
auth_param basic credentialsttl 1 hour

acl autentificat proxy_auth REQUIRED

# ── Ce are voie sa ceara ─────────────────────────────────────────────────────
#
# ⚠ Cele trei gazde eMAG, scrise fara punct in fata: `marketplace-api.emag.ro`
# potriveste EXACT gazda aia. Cu `.emag.ro` ar fi potrivit orice subdomeniu al lor,
# inclusiv unele care n-au nicio treaba cu API-ul.
acl gazde_emag dstdomain marketplace-api.emag.ro marketplace-api.emag.bg marketplace-api.emag.hu

acl port_sigur port 443
acl CONNECT method CONNECT

# ── Regulile, in ordine. Prima care se potriveste castiga. ───────────────────
#
# ⚠ ORDINEA CONTEAZA SI E SINGURUL LUCRU CARE TINE USA INCHISA.
http_access deny !autentificat
http_access deny CONNECT !port_sigur
http_access deny !CONNECT
http_access allow autentificat gazde_emag
http_access deny all

http_port 3128

# ── Fara memorie ─────────────────────────────────────────────────────────────
#
# Nu se pastreaza nimic: un tunel TLS n-are ce fi pus deoparte, iar un disc fara
# date e un disc care nu poate scurge date.
#
# ⚠ FARA `cache_dir null /tmp`, desi asa scrie in multe retete. Modulul `null` se
# compileaza optional (`--enable-storeio=null`), iar pachetul Ubuntu NU-l are —
# `squid -k parse` cade cu „Unknown cache_dir type 'null'" si scriptul de instalare
# se opreste. `cache deny all` singur face acelasi lucru si merge peste tot: fara
# `cache_dir`, squid nu deschide niciun depozit pe disc.
cache deny all

# ── Discretie ────────────────────────────────────────────────────────────────
#
# Fara antetele care spun lumii ce ruleaza aici si pe ce versiune.
via off
forwarded_for delete
httpd_suppress_version_string on

# ── Jurnal ───────────────────────────────────────────────────────────────────
#
# ⚠ Se pastreaza, si e util: documentatia eMAG recomanda explicit sa se jurnalizeze
# apelurile si raspunsurile pe 30 de zile. Aici nu se vede continutul (e tunel
# cifrat), dar se vede CINE a cerut, CAND si CATRE CE gazda — adica exact ce
# trebuie ca sa se raspunda la „a plecat cererea de la noi?".
access_log daemon:/var/log/squid/access.log squid
logfile_rotate 30

# Timpi de asteptare stransi: clientul nostru abandoneaza oricum la 25 de secunde.
connect_timeout 15 seconds
read_timeout 60 seconds
request_timeout 60 seconds

# Fara ICP: nimic altceva nu asculta in afara de 3128.
#
# ⚠ `snmp_port` si `dns_v4_first` NU se pun aici. Primul exista doar daca squid a
# fost compilat cu SNMP (pachetul Ubuntu nu e), al doilea a fost SCOS din squid 6,
# iar Ubuntu 24.04 vine cu 6.x. Amandoua ar fi facut `squid -k parse` sa cada, adica
# instalarea s-ar fi oprit pe o linie care nu aducea nimic.
icp_port 0
